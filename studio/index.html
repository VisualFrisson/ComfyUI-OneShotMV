// what was dropped: a folder (walked, hidden ones skipped) or loose files, each with its path in the drop
function filesFromDrop(dt){
  const loose = [...(dt.files || [])];  // read now: the drop's items are gone once the handler returns
  const entries = [...(dt.items || [])].map(it => it.kind === "file" && it.webkitGetAsEntry ? it.webkitGetAsEntry() : null).filter(Boolean);
  if (!entries.length) return Promise.resolve(loose.map(f => ({file: f, rel: f.name})));
  const readDir = d => new Promise((res, rej) => { const r = d.createReader(), out = [];
    const next = () => r.readEntries(b => { if (!b.length) return res(out); out.push(...b); next(); }, rej); next(); });
  const walk = async (en, path, out) => {
    if (en.name.startsWith(".")) return;
    if (en.isFile) out.push({file: await new Promise((res, rej) => en.file(res, rej)), rel: path + en.name});
    else if (en.isDirectory) for (const c of await readDir(en)) await walk(c, path + en.name + "/", out);
  };
  return (async () => { const out = []; for (const en of entries) await walk(en, "", out); return out; })();
}
const slugOf = s => String(s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase()
  .replace(/[^a-z0-9]+/g, "-").replace(/^-+/, "").slice(0, 40).replace(/-+$/, "");
function stampNow(){ const d = new Date(), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; }
// uploads the images, one at a time, into ComfyUI's input folder: oneshot-mv/worlds/<the folder's name>
// (loose files: images-<date>-<time>), then uses that folder as the World
async function uploadWorld(items){
  const hidden = rel => rel.split("/").some(s => s.startsWith(".") || s === "__MACOSX");
  items = items.filter(x => x.file && WORLD_EXT.test(x.file.name) && !hidden(x.rel));
  if (!items.length){ toast("No JPG, PNG or WebP images there."); return; }
  items.sort((a, b) => a.rel.localeCompare(b.rel, undefined, {numeric: true, sensitivity: "base"}));  // by name, as the folder lists them
  const top = items.find(x => x.rel.includes("/")), dir = top ? top.rel.split("/")[0] : "";
  const sub = "oneshot-mv/worlds/" + (slugOf(dir) || "images-" + stampNow());
  // the folder's own images keep their names; those in a folder inside it get its name in front ("day2-a.jpg")
  const nameOf = x => (dir && x.rel.startsWith(dir + "/") ? x.rel.slice(dir.length + 1) : x.rel).split("/").join("-");
  overlay("Uploading your images", `Uploading 1 of ${items.length}`);
  const bar = $("#ovbar"), fill = $("#ovfill"), line = $("#ovt2");
  bar.classList.remove("hide"); line.classList.remove("hide");
  try{
    for (let i = 0; i < items.length; i++){
      const x = items[i], name = nameOf(x), pct = Math.round(100 * i / items.length);
      $("#ovs").textContent = `Uploading ${i + 1} of ${items.length}`; line.textContent = name;
      fill.style.width = pct + "%"; bar.setAttribute("aria-valuenow", pct);
      const fd = new FormData(); fd.append("image", x.file, name); fd.append("subfolder", sub); fd.append("type", "input"); fd.append("overwrite", "true");
      const r = await fetch("/api/upload/image", {method:"POST", body:fd});
      if (!r.ok) throw new Error(`${name}: HTTP ${r.status}`);
    }
    S.brief.world_images = sub; S.worldInfo = null; saveBrief();
    const wp = $("#wpath"); if (wp) wp.value = sub;
    overlay(); refreshEstimate(); await lookWorld();
    const f = $("#wpickdir"); if (f) f.focus();
  }catch(e){ overlay(); toast("Upload failed: " + e.message); }
}

// render: queue the video (false: only the plan); review: images first (the run stops after the stills)
async function start(render, briefOverride, review){
  const b = Object.assign({}, briefOverride || S.brief);
  if (!b.song){ toast("Pick a song first."); return; }
  Object.assign(b, castOf(b), worldOf(b));  // only the artist tab that is showing goes with the brief; none with images
  const imgs = b.world_mode === "images";
  if (imgs && !b.world_images){ toast("Pick a folder of images for the World."); return; }
  if (b.cast === SINGLE && !b.artist_image && !b.artist_description){ toast("Add a photo of the artist, or describe a new one."); return; }
  if (!String(b.name || "").trim()){
    const pn = $("#pname"); if (pn) pn.classList.add("bad");
    const n = await askName(); if (!n) return;
    b.name = n; if (!String(S.brief.name || "").trim()){ S.brief.name = n; saveBrief(); }
    if (pn){ pn.value = S.brief.name; pn.classList.remove("bad"); }
  }
  b.name = String(b.name).trim();
  b.render = !!render; b.review = !!(render && review);
  let cancelled = false;
  try{
    const what = imgs ? "looking at your images" : "writing the World";
    overlay(b.review ? "Making the images" : render ? "Starting the video" : "Writing the plan",
      b.review ? `Analysing the song, ${what} and queueing the stills. The video waits until you've checked them.`
      : render ? `Analysing the song, ${what} and queueing every shot. This takes a minute or two.` : `Analysing the song, ${what} and planning every shot. Nothing renders yet.`);
    const {prompt_id} = await api("start", b);
    overlay($("#ovt").textContent, $("#ovs").textContent, async () => {
      cancelled = true;
      try{ await api("cancel_job", {prompt_id}); }catch(e){}
      overlay(); toast(render ? "Cancelled. Nothing of this video was queued." : "Cancelled. No plan was written.");
    });
    const brief = Object.assign({}, b); delete brief.render; delete brief.review;
    const t0 = Date.now();
    for (;;){
      await new Promise(r => setTimeout(r, 2000));
      if (cancelled) return;
      const j = await api("job/" + prompt_id);
      if (cancelled) return;
      const el = Math.round((Date.now() - t0) / 1000);
      if (j.state === "queued") $("#ovs").textContent = `Waiting in ComfyUI's queue (${j.ahead} ahead) · ${el} s`;
      else if (j.state === "running"){
        $("#ovs").textContent = j.step ? j.step + "…" : (render ? `Analysing the song, ${what} and queueing every shot` : `Analysing the song, ${what} and planning every shot`);
        if (j.elapsed_s != null && j.left_s != null) overlayProgress(j.elapsed_s, j.left_s);
      }
      else if (j.state === "error") throw new Error(j.error);
      else if (j.state === "done"){
        if (!j.run) throw new Error("the Director finished without a run folder");
        const briefs = store.get("briefs", {}); briefs[j.run] = brief; store.set("briefs", briefs);
        overlay(); location.hash = (render ? "#/render/" : "#/plan/") + encodeURIComponent(j.run); return;
      }
    }
  }catch(e){ if (cancelled) return; overlay(); const m = e.message || ""; toast(/^(It can't|ComfyUI refused)/.test(m) ? m : "It didn't start: " + m, Math.max(9000, 70 * m.length)); }
}

// A step you went back to: the page stays readable but greyed out and not editable, with "Restart

// Restart from this stage: a video still being made is stopped first (what it made stays in Your videos);
// then that stage opens for changes, and starting from it makes a new video
async function restartFrom(r, then, where){
  const working = r.stage !== "done" && r.stage !== "preview" && r.stage !== "review" && !r.stalled;
  if (working){
    if (!confirm(`Stop this video and start again from the ${where}? What it made so far stays in Your videos.`)) return;
    try{ const j = await api("cancel", {run: r.run}); toast(`Stopped: ${j.removed} queued job${j.removed === 1 ? "" : "s"} removed.`); }
    catch(e){ toast("It didn't stop: " + e.message); return; }

}

// ---------------------------------------------------------------- 2. The Plan
async function viewPlan(run){
  setSteps(1, run);

  if (r.stage !== "preview" && !asked){ location.hash = (r.stage === "done" ? "#/result/" : "#/render/") + encodeURIComponent(run); return; }

  const w = r.world, b = r.brief, im = imagesOf(r);
  const brief = store.get("briefs", {})[run] || (r.form && r.form.song ? r.form : null);
  const sing = r.shots.filter(s => s.kind === "sing").length, cut = r.shots.length - sing;
  const est = brief ? estimate(Object.assign({}, brief)) : r.estimate_min;
  const levels = r.shots.map(s => `<span style="flex:${s.len};background:${LEVEL_COL[s.energy]||'var(--mid)'}" title="${esc(s.time)} ${esc(s.energy)}"></span>`).join("");

// ---------------------------------------------------------------- 3. Rendering
async function viewRender(run){
  setSteps(2, run);
  const app = $("#app");
  app.innerHTML = `<p class="muted">Loading…</p>`;
  const asked = S.showRender === run; S.showRender = null;  // from the steps: a made video's render too
  let mode = "";
  const nav = S.nav;
  const tick = async () => {
    let r;
    try{ r = await api("run/" + encodeURIComponent(run)); }catch(e){ if (!mode && nav === S.nav) app.innerHTML = `<p class="banner">${esc(e.message)}</p>`; return; }
    if (nav !== S.nav) return;
    if (r.stage === "done" && !asked && mode !== "made"){ stopTimer(); location.hash = "#/result/" + encodeURIComponent(run); return; }
    if (r.stage === "preview"){ stopTimer(); location.hash = "#/plan/" + encodeURIComponent(run); return; }
    setSteps(2, run, r.stage);
    const rv = r.review || {};
    // images first: the review screen once the stills are made, and while picked ones are made again
    if (r.stage === "review" || (rv.state === "making" && rv.rounds > 0)){
      if (mode !== "review"){ mode = "review"; reviewView(r, true); } else reviewView(r, false);
      return;
    }
    // the screen's kind: a made video, images being made first, or the video being made
    const kind = r.stage === "done" ? "made" : imagesFirst(r) ? "images" : "render", first = mode !== kind;
    if (first){ renderSkeleton(r); mode = kind; }
    renderUpdate(r);
    if (r.stage === "done"){
      stopTimer();
      // went back from the Result: how it was made, greyed out, with Restart from this stage
      if (first) lockPage(() => restartRender(r), "How this video was made. Restarting makes it again from the same plan, as a new video; this one stays in Your videos.");
    }
  };
  await tick();
  if (mode !== "made") S.timer = setInterval(tick, DEMO ? 1000 : 5000);
}
// Images first is for drawn images: a described World's stills, or your own images when Extend draws their
// missing sides (Qwen-Image 2.1; For professional use crops). Your own images only cropped are the stills.
const reviewable = (im, brief) => !im || !!(brief && brief.image_fit === "extend" && !brief.professional);
// Restart from Rendering (a made video): make it again from the same plan, straight or images first
function restartRender(r){
  const brief = store.get("briefs", {})[r.run] || (r.form && r.form.song ? r.form : null);
  if (!brief){ toast("This video's brief isn't recorded, so start it again from The Brief."); return; }
  const b = $("#restart"); if (!b) return;
  b.outerHTML = (reviewable(imagesOf(r), brief) ? `<button class="btn" id="rrreview" type="button">Generate images and review</button>` : "")
    + `<button class="btn primary" id="rrmake" type="button">Make the video</button>`;
  if ($("#rrreview")) $("#rrreview").onclick = () => start(true, brief, true);
  $("#rrmake").onclick = () => start(true, brief);
}
// images first, the stills made: pick any to make again, each with a note on what to change, then
// Make the video. The picks, notes and new images are kept in this browser until they're sent.
const reviewKey = run => "review." + run;
function reviewView(r, fresh){
  const run = r.run, rv = r.review || {}, busy = r.stage !== "review";
  const R = Object.assign({sel: {}, img: {}}, store.get(reviewKey(run), {}));
  R.img = R.img || {};
  const can = new Set(rv.remake || []), sw = new Set(rv.swap || []), redo = new Set(busy ? rv.redo || [] : []);
  const sig = JSON.stringify([r.stage, rv.rounds, r.shots.map(s => s.still), r.pct]);
  const app = $("#app");
  if (!fresh && app.dataset.sig === sig) return;  // nothing new: leave notes being typed alone
  if (!fresh && document.activeElement && document.activeElement.closest && document.activeElement.closest("#rvboard") && !busy && app.dataset.busy === "0") return;
  app.dataset.sig = sig; app.dataset.busy = busy ? "1" : "0";
  const cls = shotClass(r.brief.format), own = !!imagesOf(r) || sw.size > 0;
  const swapped = () => Object.keys(R.img).map(Number).filter(n => sw.has(n));
  const picked = () => Object.keys(R.sel).map(Number).filter(n => can.has(n) && !R.img[n]);
  const save = () => store.set(reviewKey(run), R);
  const makeLabel = (n, m) => n && m ? `Make ${n + m} images` : m ? (m === 1 ? "Make the new image" : `Make ${m} new images`) : n ? (n === 1 ? "Fix the image" : `Fix ${n} images`) : "";
  // a picked image isn't made until the bar's button is pressed: the card says so, and how it fits
  const notYet = im => {
    const fit = im.fit === "extend" ? "the striped sides get drawn in"
      : im.face === false ? "it's cropped from the middle (no face found)"
      : im.asked === "extend" ? "it's cropped around the face (it's already close to the video's shape)" : "it's cropped around the face";
    return `Not made yet: ${fit} when you press ${makeLabel(picked().length, swapped().length)} below.`;
  };
  const hint = s => own ? "Like “keep the wall plain, no new people”"
    : s.kind === "broll" ? "Like “at dusk, wider, warmer light”" : "Like “older, in a raincoat, harder light”";
  const spares = r.shots.some(s => s.kind === "broll") ? " Some cutaways are spares: the take check keeps the ones it needs." : "";
  const how = can.size && sw.size ? "Fix any with a note or swap in another of your images"
    : sw.size ? "Swap any for another of your images" : "Fix any you want changed, with a note on what to change";
  app.innerHTML = `
  <div class="head"><div><h1>Review the images</h1>${projectOf(r) ? `<p class="proj">${esc(projectOf(r))}</p>` : ""}<p class="sub">${esc(worldName(r))} · ${esc(r.brief.from)} – ${esc(r.brief.to)} · ${esc(r.brief.format)} · ${esc(r.brief.preset)}</p></div>
    <div style="text-align:right"><div class="mono" style="font-size:22px;font-weight:600">${mins(r.elapsed_min)} in</div><div class="muted" style="font-size:14px">${busy ? "fixing images" : "waiting for you"}</div></div></div>
  ${busy ? `<div class="banner info" role="status"><b>${rv.rounds ? "Fixing the picked images" : "Making the images"}…</b> The board updates as each one lands. <div class="acts"><button class="btn danger sm" id="rvstop" type="button">Stop</button></div></div>`
    : `<div class="banner info" role="status">${own && !can.size ? "Your images, brought to the video's shape" : "Every image is made"}${rv.rounds ? `, with ${rv.rounds} round${rv.rounds > 1 ? "s" : ""} of changes` : ""}. ${how}, or make the video as it is.${spares}</div>`}
  <section class="card" style="padding:20px 22px" aria-labelledby="rvh">
    <div class="row" style="margin-bottom:14px"><h2 class="label" id="rvh">Images</h2>${can.size ? `<span class="tiny">${can.size} of ${r.shots.length} can be fixed</span>` : ""}</div>
    <div class="board rvboard" id="rvboard">${r.shots.map(s => {
      const nw = sw.has(s.n) && R.img[s.n], on = !nw && R.sel[s.n] != null && can.has(s.n), again = redo.has(s.n);
      const src = nw ? R.img[s.n].url : s.still;
      const img = src && !again ? `<img src="${esc(src)}" alt="${esc(nw ? R.img[s.n].name : s.role)}" loading="lazy">`
        : `<div class="ph">${again || busy ? "Making…" : s.kind === "broll" ? "Cutaway" : "No still"}</div>`;
      const acts = busy ? "" : (can.has(s.n) && !nw ? `<button type="button" class="btn sm ${on ? "" : "ghost"}" data-pick="${s.n}" aria-pressed="${on}">${on ? "Picked" : "Fix image"}</button>` : "")
        + (sw.has(s.n) ? (nw ? `<button type="button" class="btn sm" data-undo="${s.n}">Undo</button>` : `<button type="button" class="btn sm ghost" data-swap="${s.n}" data-kind="${s.kind}">New image</button>`) : "");
      return `<div class="shot rvcard ${cls} ${on || nw ? "on" : ""}" style="border-top-color:${LEVEL_COL[s.energy]||'var(--mid)'}">
        <div class="im">${img}<span class="tag">${s.n} · ${esc(s.time)}</span>${on ? '<span class="tag r">to fix</span>' : nw ? '<span class="tag r">new, not made yet</span>' : again ? '<span class="tag r">fixing</span>' : ""}</div>
        <div class="ft"><span class="who" title="${esc(nw ? R.img[s.n].name : s.role)}">${esc(nw ? R.img[s.n].name : s.kind === "broll" ? "cutaway" : (s.role || s.size))}</span>${acts ? `<span class="acts">${acts}</span>` : ""}</div>
        ${on ? `<label class="rvnote"><span class="tiny">What to change (optional)</span><textarea rows="2" data-note="${s.n}" placeholder="${esc(hint(s))}" ${busy ? "disabled" : ""}></textarea></label>` : ""}
        ${nw && !busy ? `<div class="rvnew">${esc(notYet(R.img[s.n]))}</div>` : ""}
      </div>`; }).join("")}</div>
  </section>
  <div class="bar">
    <span class="grow" id="rvcount" style="text-align:left"></span>
    <button class="btn" id="rvremake" type="button"></button>
    <button class="btn primary big" id="rvgo" type="button">Make the video</button>
  </div>`;
  app.querySelectorAll("textarea[data-note]").forEach(t => { t.value = R.sel[t.dataset.note] || ""; t.oninput = () => { R.sel[t.dataset.note] = t.value; save(); }; });
  app.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { const n = b.dataset.pick;
    if (R.sel[n] != null) delete R.sel[n]; else R.sel[n] = ""; save(); reviewView(r, true);
    const t = app.querySelector(`textarea[data-note="${n}"]`); if (t) t.focus(); });
  app.querySelectorAll("[data-undo]").forEach(b => b.onclick = () => { const n = b.dataset.undo;
    delete R.img[n]; save(); reviewView(r, true); const f = app.querySelector(`[data-swap="${n}"]`); if (f) f.focus(); });
  app.querySelectorAll("[data-swap]").forEach(b => b.onclick = () => { const n = b.dataset.swap;
    imageChooser(run, Number(n), b.dataset.kind === "sing", b, im => { R.img[n] = im; delete R.sel[n]; save(); reviewView(r, true);
      toast(`Press ${makeLabel(picked().length, swapped().length)} below to make it.`);
      const u = app.querySelector(`[data-undo="${n}"]`); if (u) u.focus(); }); });
  const draw = () => { const n = picked().length, m = swapped().length;
    const say = [n ? `${n} to fix` : "", m ? `${m} new image${m > 1 ? "s" : ""}` : ""].filter(Boolean).join(", ");
    $("#rvcount").textContent = busy ? "Wait for the images being made." : say ? say + "." : "Nothing picked: the video uses these images.";
    const rm = $("#rvremake");
    rm.textContent = makeLabel(n, m) || (can.size ? "Fix images" : "Make new images");
    rm.disabled = busy || !(n + m); rm.classList.toggle("primary", !!(n + m) && !busy);
    $("#rvgo").disabled = busy; $("#rvgo").classList.toggle("primary", !(n + m)); };
  draw();
  $("#rvremake").onclick = async () => {
    const items = picked().map(n => ({n, note: R.sel[n] || ""})).concat(swapped().map(n => ({n, image: R.img[n].name, src: R.img[n].src, fit: R.img[n].fit})));
    if (!items.length) return;
    try{ overlay("Changing the images", `${items.length} image${items.length > 1 ? "s" : ""}.`);
      const j = await api("review_remake", {run, items}); overlay(); store.set(reviewKey(run), {sel: {}, img: {}});
      const k = (j.stills || 0) + (j.picked || 0);
      toast(`Making ${k} image${k === 1 ? "" : "s"}.`); viewRender(run); }
    catch(e){ overlay(); toast("It didn't start: " + e.message, 9000); }
  };
  $("#rvgo").onclick = async () => {
    const n = picked().length + swapped().length;
    if (n && !confirm(`Make the video now? The ${n} picked image${n > 1 ? "s aren't" : " isn't"} changed.`)) return;
    try{ overlay("Starting the video", "Queueing every clip with these images."); await api("review_go", {run}); overlay();
      store.set(reviewKey(run), {sel: {}, img: {}}); toast("The video is being made."); viewRender(run); }
    catch(e){ overlay(); toast("It didn't start: " + e.message, 9000); }
  };
  if ($("#rvstop")) $("#rvstop").onclick = async () => {
    if (!confirm("Stop making these images? The ones already made are kept.")) return;
    try{ const j = await api("cancel", {run}); toast(`Stopped: ${j.removed} queued job${j.removed === 1 ? "" : "s"} removed.`); }catch(e){ toast(e.message); }
  };
}
// Another of the user's own images for one shot: from the World's folder, or one uploaded here
// (into ComfyUI's input folder, oneshot-mv/added/<run>). Cropped around the face or extended, as the
// run's images are unless changed here; a sung shot needs a face big enough to sing.
function imageChooser(run, shot, sung, back, done){
  const ov = document.createElement("div");
  ov.className = "pickov";
  ov.innerHTML = `<div class="pickbox" role="dialog" aria-modal="true" aria-labelledby="pkh">
    <div class="row"><h2 class="label" id="pkh" style="flex:1">A new image for shot ${shot}</h2><button class="btn sm ghost" id="pkx" type="button">Cancel</button></div>
    <div class="row" style="flex-wrap:wrap"><div class="seg mini" role="group" aria-label="How it fits the video" id="pkfit"></div><span class="tiny" id="pkfitnote" style="flex:1;min-width:220px"></span></div>
    <div class="pkgrid" id="pkg"><p class="muted">Loading your images…</p></div>
    <div class="row"><button class="btn sm" id="pkup" type="button">Upload an image</button><input type="file" id="pkf" accept=".png,.jpg,.jpeg,.webp" hidden><span class="tiny" id="pkmsg" role="status" style="flex:1"></span></div>
  </div>`;
  document.body.appendChild(ov);
  let list = null, fit = "crop", busy = false;
  const msg = t => { ov.querySelector("#pkmsg").textContent = t; };
  const close = () => { ov.remove(); document.removeEventListener("keydown", key, true); if (back && back.isConnected) back.focus(); };
  const key = e => { if (e.key === "Escape"){ e.preventDefault(); close(); } };
  document.addEventListener("keydown", key, true);
  ov.onclick = e => { if (e.target === ov) close(); };
  ov.querySelector("#pkx").onclick = close;
  const drawFit = () => {
    const box = ov.querySelector("#pkfit");
    box.innerHTML = [["crop", "Crop"], ["extend", "Extend"]].map(([k, n]) =>
      `<button type="button" class="opt" data-f="${k}" aria-pressed="${fit === k}"${k === "extend" && !list.extend ? " disabled" : ""}>${n}</button>`).join("");
    ov.querySelector("#pkfitnote").textContent = !list.extend ? "Cropped around the face: Extend is off for professional use."
      : fit === "extend" ? "Keeps the whole image: Qwen-Image 2.1 draws the missing sides. An image already close to the video's shape is cropped."
      : "Cropped to the video's shape around the face. Nothing is drawn in.";
    box.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { fit = b.dataset.f; drawFit(); const f = box.querySelector(`[data-f="${fit}"]`); if (f) f.focus(); });
  };
  // what the job will make of it: the crop around the face, or the whole image with the sides to draw
  const choose = async (im, el) => {
    if (busy) return;
    busy = true; if (el) el.classList.add("busy"); msg(`Looking at ${im.name}…`);
    try{
      const q = `src=${encodeURIComponent(im.src)}&name=${encodeURIComponent(im.name)}&fit=${fit}`;
      const f = await api(`review_fit/${encodeURIComponent(run)}?${q}`);
      if (sung && !f.sings){
        msg(`${im.name} has no face big enough to sing${f.fit === "extend" ? " with the whole image in the frame. Try Crop, or" : ":"} pick another image.`);
        return;
      }
      close(); done({name: im.name, src: im.src, fit: f.fit, asked: fit, face: f.face, url: f.preview});
    }catch(e){ msg(e.message); }
    finally{ busy = false; if (el && el.isConnected) el.classList.remove("busy"); }
  };
  const draw = () => {
    const g = ov.querySelector("#pkg");
    g.innerHTML = list.images.length ? list.images.map((im, i) => `<button type="button" class="pkim" data-i="${i}">
      <img src="${esc(im.url)}" alt="" loading="lazy"><span title="${esc(im.name)}">${esc(im.name)}</span>${sung && !im.sings ? `<em>face may be too small to sing</em>` : im.src === "added" ? "<em style=\"color:var(--muted)\">uploaded</em>" : ""}</button>`).join("")
      : `<p class="muted">No images found.</p>`;
    g.querySelectorAll(".pkim").forEach(b => b.onclick = () => choose(list.images[+b.dataset.i], b));
    const first = g.querySelector(".pkim"); if (first) first.focus();
  };
  const load = async () => { list = await api("review_images/" + encodeURIComponent(run)); fit = list.fit || "crop"; drawFit(); draw(); };
  load().catch(e => { ov.querySelector("#pkg").innerHTML = `<p class="banner">${esc(e.message)}</p>`; });
  const fi = ov.querySelector("#pkf");
  ov.querySelector("#pkup").onclick = () => fi.click();
  fi.onchange = async () => {
    const f = fi.files[0]; fi.value = "";
    if (!f || !list) return;
    if (!WORLD_EXT.test(f.name)){ msg("Pick a JPG, PNG or WebP image."); return; }
    msg("Uploading…");
    try{
      const fd = new FormData(); fd.append("image", f, f.name); fd.append("subfolder", list.added); fd.append("type", "input");
      const up = await fetch("/api/upload/image", {method:"POST", body:fd});
      if (!up.ok) throw new Error("HTTP " + up.status);
      const got = await up.json();
      const keep = fit; await load(); fit = keep; drawFit();
      const im = list.images.find(x => x.src === "added" && x.name === got.name);
      if (im) await choose(im, null); else msg("");
    }catch(e){ msg("Upload failed: " + e.message); }
  };

    try{
      overlay("Queueing the pickups", `${P.list.length} shot${P.list.length > 1 ? "s" : ""}, then a new cut.`);
      await api("pickups", {run: r.run, items: P.list.map(x => ({n: x.n, mode: x.mode, note: x.note}))});
      store.set(pickKey(run), []); overlay(); viewResult(run);
    }catch(e){ overlay(); toast("Pickups didn't start: " + e.message, 9000); }
  };
  // post processing: FX, grade, grain, vignette; one Apply re-cuts with all of them
  const ENERGIES = [["low", "Low energy sections"], ["medium", "Medium energy sections"], ["high", "High energy sections"]];
  const dirty = () => JSON.stringify(E.fx) !== JSON.stringify(F0.fx) || ["look","grain","grain_size","vignette"].some(k => String(E[k]) !== String(F0[k]));
  const cap = w => w.charAt(0).toUpperCase() + w.slice(1);
  const drawFxSeg = () => {
    $("#efx").innerHTML = ENERGIES.map(([k, label]) => `<div class="fxrow"><span class="fxlab"><i style="background:${LEVEL_COL[k]}"></i>${label}</span>
      <div class="seg" role="group" aria-label="${label}: audio-reactive FX">${["none","subtle","intense"].map(f => `<button type="button" class="opt" data-en="${k}" data-x="${f}" aria-pressed="${E.fx[k]===f}">${cap(f)}</button>`).join("")}</div></div>`).join("");
    $("#efx").querySelectorAll(".opt").forEach(el => el.onclick = () => { E.fx[el.dataset.en] = el.dataset.x; drawFxSeg(); drawApply(); });
    const v = ENERGIES.map(([k]) => E.fx[k]);
    $("#sum-fx").textContent = v.every(x => x === v[0]) ? cap(v[0]) : `${cap(v[0])} · ${cap(v[1])} · ${cap(v[2])}`;
  };
  const grades = r.looks || [{id: "none", name: "None"}];  // None first: the default
  const drawGrades = () => {
    $("#grades").innerHTML = grades.map(l => `<button type="button" class="grade" data-l="${l.id}" aria-pressed="${E.look===l.id}"><span class="gimg"><img src="/oneshot-mv/api/look/${encodeURIComponent(r.run)}?look=${l.id}&w=320&v=${esc(r.looks_sig || "")}" alt="" onload="this.parentNode.classList.add('ok')"></span><span class="gname">${esc(l.name)}</span></button>`).join("");
    $("#grades").querySelectorAll(".grade").forEach(el => el.onclick = () => { E.look = E.look === el.dataset.l ? "none" : el.dataset.l; drawGrades(); drawApply(); drawGrain(); });
    const lk = grades.find(l => l.id === E.look); $("#sum-grade").textContent = lk ? lk.name : "None";
  };
  const gi = $("#gi"), gs = $("#gs"), vg = $("#vg");
  const drawSliders = () => { gi.value = Math.round(E.grain / 0.2 * 100); $("#giv").textContent = gi.value + "%"; gs.value = E.grain_size; $("#gsv").textContent = ({0.5:"finest",1:"fine",1.5:"fine+",2:"medium",2.5:"medium+",3:"coarse",3.5:"coarse+",4:"chunky"})[E.grain_size] || E.grain_size; vg.value = Math.round(E.vignette * 100); $("#vgv").textContent = vg.value + "%";
    $("#sum-grain").textContent = +E.grain > 0 ? `${gi.value}% · ${$("#gsv").textContent}` : "Off"; $("#sum-vig").textContent = +E.vignette > 0 ? vg.value + "%" : "Off"; };
  let grainT = 0;
  const drawGrain = () => { clearTimeout(grainT); grainT = setTimeout(() => {
    const im = $("#grainimg"), px = Math.round((im.parentNode.clientWidth || 300) * (window.devicePixelRatio || 1) / 16) * 16;
    im.src = `/oneshot-mv/api/grain/${encodeURIComponent(r.run)}?look=${encodeURIComponent(E.look || "none")}&g=${E.grain}&s=${E.grain_size}&w=${px}&v=${esc(r.looks_sig || "")}`; }, 250); };
  gi.oninput = () => { E.grain = Math.round(+gi.value * 0.2 * 10) / 1000; drawSliders(); drawApply(); drawGrain(); };
  gs.oninput = () => { E.grain_size = +gs.value; drawSliders(); drawApply(); drawGrain(); };
  vg.oninput = () => { E.vignette = +vg.value / 100; drawSliders(); drawApply(); };
  const drawApply = () => { const a = $("#apply"), d = dirty(); a.disabled = !d || shooting; a.innerHTML = d ? 'Apply changes <span class="eta-b">about 2 min</span>' : "No changes yet"; primary(); };
  drawFxSeg(); drawGrades(); drawSliders(); drawApply();
  // one panel open at a time; the open one is remembered across cuts
  const openPanel = k => { REFINE_OPEN = k;
    document.querySelectorAll(".refine .acc").forEach(sec => { const on = sec.dataset.acc === k;
      sec.classList.toggle("open", on); sec.querySelector(".acc-h").setAttribute("aria-expanded", String(on)); sec.querySelector(".acc-b").hidden = !on; });
    if (k === "grain") drawGrain(); };
  document.querySelectorAll(".refine .acc-h").forEach(b => b.onclick = () => { const k = b.parentNode.dataset.acc; openPanel(REFINE_OPEN === k ? null : k); });
  openPanel(REFINE_OPEN);
  $("#apply").onclick = async () => {
    try{
      overlay("Making the new cut", "The same shots with the new FX, grade, grain and vignette. Nothing re-renders.");
      const {prompt_id} = await api("recut", {run: r.run, fx: E.fx, look: E.look, grain: E.grain, grain_size: E.grain_size, vignette: E.vignette});
      let cancelled = false;
      overlay($("#ovt").textContent, $("#ovs").textContent, async () => { cancelled = true;
        let j = {}; try{ j = await api("cancel_job", {prompt_id}); }catch(e){}
        overlay(); toast(j.removed ? "Cancelled. The cut you have stays." : "Cancelled. If it was already cutting, the new cut may still appear.", 7000); });
      const t0 = Date.now();
      for (;;){ await new Promise(res => setTimeout(res, 2000)); if (cancelled) return; const j = await api("job/" + prompt_id); if (cancelled) return; if (j.state === "error") throw new Error(j.error); if (j.state === "done") break;
        $("#ovs").textContent = `${j.state === "queued" ? "Waiting in the queue" : "Cutting"} · ${clock((Date.now() - t0) / 1000)}`; }
      overlay(); viewResult(r.run); toast("New cut ready.");
    }catch(e){ overlay(); toast("The new cut failed: " + e.message, 8000); }
  };
  drawFix(); drawPk();
  // the Post Processing title takes the room left above the first panel, so that panel's top
  // lines up with the video's top
  const alignPP = () => { const pp = $("#pph"), pl = $(".player"); if (!pp || !pl) return;
    pp.style.height = "";
    const side = pp.getBoundingClientRect(), main = pl.getBoundingClientRect();
    if (side.left < main.right) return;  // stacked on a narrow screen
    const gap = parseFloat(getComputedStyle(pp.parentNode).rowGap) || 10, h = Math.round(main.top - side.top - gap);
    if (h >= 24) pp.style.height = h + "px"; };
  alignPP(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(alignPP);
  window.onresize = alignPP;
  // pickups shooting: a progress banner, then the new version
  if (r.pickup && r.pickup.n){
    const pb = $("#pkbanner");
    const drawBanner = st => {
      if (st.state === "running"){
        const done = Math.max(0, st.jobs - st.jobs_left), pct = Math.round(100 * done / Math.max(1, st.jobs));
        const what = st.kind === "sharpen" ? `Re-decoding ${st.items.length} clips` : `Shooting pickups: ${st.items.map(x => "shot " + x.shot).join(", ")}`;
        pb.innerHTML = `<section class="card" style="margin-bottom:20px"><div class="row" style="justify-content:space-between"><b>${what}</b><span class="row"><span class="mono tiny">${done} of ${st.jobs} jobs · about ${mins(st.left_min)} left</span><button class="btn sm danger" id="pkstop" type="button">Stop</button></span></div>
          <div class="progress" style="margin:12px 0 0"><div style="width:${pct}%"></div></div><p class="tiny" style="margin:10px 0 0">The video below is the cut before. It's kept as a version when the new cut is ready.</p></section>`;
        $("#pkstop").onclick = async () => {
          if (!confirm(`Stop the ${st.kind === "sharpen" ? "re-decode" : "pickups"}? What isn't shot yet is dropped; the cut you have stays.`)) return;
          try{ const j = await api("cancel", {run: r.run}); toast(`Stopped: ${j.removed} queued job${j.removed === 1 ? "" : "s"} removed.`); }catch(e){ toast(e.message); }
        };
      } else if (st.state === "stopped"){
        pb.innerHTML = `<div class="banner">The last ${st.kind === "sharpen" ? "re-decode" : "pickups"} stopped before the new cut was made; the ComfyUI console shows why. The video below is the cut before.</div>`;
      } else pb.innerHTML = "";
    };
    drawBanner(r.pickup);
    const nav0 = S.nav;
    if (r.pickup.state === "running"){
      S.timer = setInterval(async () => {
        try{ const r2 = await api("run/" + encodeURIComponent(run)); if (nav0 !== S.nav) return; if (r2.pickup.state !== "running"){ stopTimer(); viewResult(run); if (r2.pickup.state === "done") toast("New cut ready, with the pickups."); } else drawBanner(r2.pickup); }catch(e){}
      }, DEMO ? 1000 : 5000);
    }
  }
  $("#showplan").onclick = e => { e.preventDefault(); showPlanTable(r); };
}
function showPlanTable(r){
  const box = document.createElement("section"); box.className = "card"; box.style.marginTop = "24px";
  box.innerHTML = `<h2 class="label" style="margin-bottom:10px">The plan</h2><div class="tablewrap"><table class="shotlist"><thead><tr><th>#</th><th>Time</th><th>Energy</th><th>Who</th><th>Wearing</th><th>Where</th></tr></thead><tbody>${r.shots.map(s => `<tr><td class="mono muted">${s.n}</td><td class="mono">${esc(s.time)}</td><td>${lvlBadge(s.energy)}</td><td><b>${esc(s.role)}</b></td><td class="muted">${esc(s.wear)}</td><td class="muted">${esc(s.place)}</td></tr>`).join("")}</tbody></table></div>`;
  $("#app").appendChild(box); box.scrollIntoView({behavior:"smooth"});
}

// ---------------------------------------------------------------- Your videos
async function viewVideos(){
  setSteps(-1);
  const app = $("#app");
  app.innerHTML = `<div class="head"><div><h1>Your videos</h1><p class="sub">Every OneShot MV run on this ComfyUI, newest first.</p></div><a class="btn primary" href="#/">New video</a></div><div class="vgrid" id="vg"><p class="muted">Loading…</p></div>`;
  try{
    const runs = await api("runs");
    $("#vg").innerHTML = runs.length ? runs.map(v => {
      const st = v.video ? ["ok","Done","result"] : (v.rendered ? ["run","Rendering","render"] : ["pre","Plan","plan"]);
      return `<a class="vcard" href="#/${st[2]}/${encodeURIComponent(v.run)}"><div class="th">${v.thumb ? `<img src="${esc(v.thumb)}" alt="" loading="lazy">` : ""}</div>
        <div class="bd"><div class="row" style="justify-content:space-between;gap:8px"><b style="font-size:15px">${esc(v.project || v.world || "House look")}</b><span class="badge ${st[0]}">${st[1]}</span></div>
        ${v.project ? `<div class="tiny" style="margin-top:4px">${esc(v.world || "House look")}</div>` : ""}<div class="tiny mono" style="margin-top:4px">${esc(v.when.replace("T"," "))} · ${esc(v.format||"")} · ${v.seconds}s</div><div class="tiny" style="margin-top:2px;word-break:break-all">${esc(v.run)}</div></div></a>`;
    }).join("") : `<p class="muted">No runs yet. <a href="#/">Make your first video.</a></p>`;
  }catch(e){ $("#vg").innerHTML = `<p class="banner">${esc(e.message)}</p>`; }
}

// ---------------------------------------------------------------- app icon
// The logo: a crosshair with a sound wave in its sights, on a tile in the palette's gradient.
const LOGO = id => `<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="${id}" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">` +
  `<stop offset="0" style="stop-color:var(--g1)"/><stop offset=".36" style="stop-color:var(--g2)"/><stop offset=".68" style="stop-color:var(--g3)"/><stop offset="1" style="stop-color:var(--g4)"/></linearGradient></defs>` +
  `<rect width="32" height="32" rx="7" fill="url(#${id})"/><circle cx="16" cy="16" r="9.6" fill="none" stroke="#0b0d10" stroke-width="2.2"/>` +
  `<path d="M16 3.5v4.4M16 24.1v4.4M3.5 16h4.4M24.1 16h4.4" stroke="#0b0d10" stroke-width="2.2" stroke-linecap="round"/>` +
  [[11.6, 4.5], [14.2, 9], [16.8, 12], [19.4, 6.5]].map(([x, h]) => `<rect x="${x - 1}" y="${16 - h / 2}" width="2" height="${h}" rx="1" fill="#0b0d10"/>`).join("") + `</svg>`;
function drawIcon(){
  $("#mark").innerHTML = LOGO("lg");
  // a favicon can't read the page's CSS variables, so it gets the palette's colours written in
  const cs = getComputedStyle(document.documentElement);
  $("#fav").href = "data:image/svg+xml," + encodeURIComponent(LOGO("fg").replace(/var\((--[a-z0-9]+)\)/g, (m, v) => cs.getPropertyValue(v).trim() || "#000"));
}

// the palettes, with the surface and gradient colours the menu previews
const PALS = [["neon","Neon","#0d1015",["#d7ff3d","#19e6b0","#3a86ff","#b44dff"]],["sunset","Sunset","#130e13",["#ffd166","#ff8a5b","#ff4f8b","#b14dff"]],
              ["aurora","Aurora","#0a1218",["#a8ffe0","#4fd8ff","#6a86ff","#c38bff"]],["ember","Ember","#120f0c",["#ffe27a","#ffb347","#ff7a45","#ff4d6d"]]];
function drawLook(){
  const cur = document.documentElement.getAttribute("data-pal") || "neon", p = PALS.find(x => x[0] === cur) || PALS[0];
  $("#lookname").textContent = "Look: " + p[1];
  $("#lookmenu").innerHTML = PALS.map(([id, name, bg, g]) => `<button type="button" role="menuitemradio" aria-checked="${id === cur}" data-pal="${id}">
    <span class="pv" aria-hidden="true" style="background:linear-gradient(90deg,${g.join(",")})"></span><span class="nm">${name}</span><span class="ck" aria-hidden="true">${id === cur ? "✓" : ""}</span></button>`).join("");
  $("#lookmenu").querySelectorAll("[data-pal]").forEach(el => el.onclick = () => {
    document.documentElement.setAttribute("data-pal", el.dataset.pal); try{ localStorage.setItem("osmv.pal", el.dataset.pal); }catch(e){}
    drawLook(); drawIcon(); closeLook(); });
}
const closeLook = () => { $("#lookmenu").classList.add("hide"); $("#look").setAttribute("aria-expanded", "false"); };
$("#look").onclick = e => { e.stopPropagation(); const m = $("#lookmenu"), open = m.classList.contains("hide"); m.classList.toggle("hide", !open); $("#look").setAttribute("aria-expanded", String(open));
  if (open){ const b = m.querySelector('[aria-checked="true"]'); if (b) b.focus(); } };
document.addEventListener("click", e => { if (!e.target.closest(".lookwrap")) closeLook(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#lookmenu").classList.contains("hide")){ closeLook(); $("#look").focus(); } });
drawLook();
drawIcon();
demoBar();
loadSystem();
setInterval(loadSystem, 30000);
route();
</script>
