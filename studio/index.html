<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OneShot MV Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0A;--panel:#141414;--panel2:#1C1C1C;--line:#2A2A2A;--line2:#383838;--line3:#4A4A4A;
  --text:#F2F2F2;--muted:#A6A6A6;--dim:#8C8C8C;--accent:#C8FF3D;--accent-bg:#1B2309;--accent-bg2:#1E260F;
  --accent-text:#E2FFA0;--warn:#FFB547;--bad:#FF6B5B;--low:#4F4F4F;--mid:#9C9C9C;--high:#C8FF3D;
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45}
a{color:var(--accent)}a:hover{color:var(--accent-text)}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}.dim{color:var(--dim)}
header.top{display:flex;align-items:center;gap:20px;padding:14px 32px;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;background:rgba(10,10,10,.94);backdrop-filter:blur(6px);z-index:10}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.logo .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px 4px rgba(200,255,61,.45)}
.logo b{font-weight:800;font-stretch:125%;letter-spacing:.04em;font-size:16px}
nav.steps{display:flex;gap:6px;flex-wrap:wrap;margin-left:12px}
.step{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;font-size:13px;color:#999}
.step .n{width:22px;height:22px;border-radius:50%;border:1px solid var(--line3);display:flex;align-items:center;justify-content:center;font-size:12px}
.step.done{color:var(--muted)}.step.done .n{background:var(--line2);border-color:var(--line2);color:var(--text)}
.step.now{background:var(--accent-bg);color:var(--text);font-weight:600}.step.now .n{background:var(--accent);border-color:var(--accent);color:#0A0A0A;font-weight:800}
.topright{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--muted);padding:6px 10px;border:1px solid var(--line);border-radius:8px}
.chip .led{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.chip .led.off{background:var(--bad)}
.toplink{font-size:14px;font-weight:600;text-decoration:none}
main{max-width:1376px;margin:0 auto;padding:30px 32px 96px}
h1{margin:0;font-size:40px;line-height:1.05;font-weight:800;font-stretch:112%;letter-spacing:-.01em}
.sub{margin:8px 0 0;color:var(--muted);font-size:16px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.cols{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.colmain{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:20px}
.colside{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 24px}
.label{margin:0;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:12px;background:var(--panel2);color:var(--text);border:1px solid var(--line2);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{border-color:var(--line3);color:var(--text)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.primary{background:var(--accent);color:#0A0A0A;border:none;font-weight:800;box-shadow:0 0 30px rgba(200,255,61,.22)}
.btn.primary:hover{background:#D6FF63;color:#0A0A0A}
.btn.big{min-height:56px;font-size:17px;font-stretch:110%;border-radius:14px;padding:0 24px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:none}
.btn.danger{border-color:#5A2A24;color:#FFB0A6}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.opt{min-height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;background:var(--panel2);color:#D4D4D4;border:1px solid var(--line2)}
.opt[aria-pressed=true]{background:var(--accent-bg2);color:var(--accent-text);border-color:var(--accent)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fmt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:84px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;background:var(--panel2);color:#D4D4D4;border:1px solid var(--line2)}
.fmt[aria-pressed=true]{background:var(--accent-bg2);color:var(--accent-text);border-color:var(--accent)}
.fmt i{display:block;border:2px solid currentColor;border-radius:4px}
.tier{text-align:left;padding:13px 16px;border-radius:12px;cursor:pointer;background:var(--panel2);border:1px solid var(--line2);width:100%}
.tier[aria-pressed=true]{background:var(--accent-bg2);border-color:var(--accent)}
.tier .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tier .eta{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.tier[aria-pressed=true] .eta{color:var(--accent)}
.tier small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
textarea,select,input[type=number],input[type=text]{width:100%;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line2);color:var(--text);font:inherit}
textarea{font-size:16px;line-height:1.4;resize:vertical;min-height:84px}
textarea:focus,select:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.drop{border:1.5px dashed var(--line3);border-radius:14px;padding:28px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-bg)}
.wave{position:relative;margin-top:32px;height:112px;cursor:pointer;user-select:none}
.wave .bars{display:flex;align-items:center;gap:2px;height:112px}
.wave .bars span{flex:1 1 0;min-width:0;border-radius:2px}
.wave .win{position:absolute;top:-6px;bottom:-6px;border:2px solid var(--text);border-radius:8px;background:rgba(255,255,255,.05)}
.wave .win::before,.wave .win::after{content:"";position:absolute;top:50%;margin-top:-14px;width:8px;height:28px;border-radius:4px;background:var(--text)}
.wave .win::before{left:-5px}.wave .win::after{right:-5px}
.wave .wl{position:absolute;top:-28px;font-family:var(--mono);font-size:12px;font-weight:600;white-space:nowrap}
.wave .ph{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--accent);box-shadow:0 0 6px rgba(200,255,61,.8);display:none}
.ticks{position:relative;height:18px;margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--dim)}
.ticks span{position:absolute}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tile{text-align:left;padding:0;border-radius:12px;overflow:hidden;cursor:pointer;background:var(--panel2);border:2px solid var(--line);display:flex;flex-direction:column}
.tile[aria-pressed=true]{background:var(--accent-bg2);border-color:var(--accent)}
.tile .sw{height:56px;display:flex}.tile .sw i{flex:1}
.tile .ims{height:96px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.tile .ims img{width:100%;height:96px;object-fit:cover;display:block}
.tile .ic{height:96px}
.tile .ic{height:56px;display:flex;align-items:center;justify-content:center;background:var(--panel2);color:var(--muted)}
.tile[aria-pressed=true] .ic{color:var(--accent)}
.tile .tx{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:15px;font-weight:800}.tile small{font-size:12px;color:var(--muted);line-height:1.35}
.adv summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;min-height:40px;display:flex;align-items:center;gap:8px;list-style:none}
.adv summary::-webkit-details-marker{display:none}
.adv[open] summary .car{transform:rotate(90deg)}
.adv .car{transition:transform .15s}
.advgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:6px}
.advgrid .wide{grid-column:1/-1}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.tiny{font-size:12px;color:var(--dim)}
.stack{display:flex;flex-direction:column;gap:12px}
.center{text-align:center}
/* plan */
.wchips{display:flex;flex-wrap:wrap;gap:6px}.wchips span{padding:5px 10px;border-radius:999px;background:var(--panel2);font-size:13px}
.kv{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.emap{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.shotlist{width:100%;border-collapse:collapse;font-size:14px}
.shotlist th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
.shotlist td{padding:10px;border-bottom:1px solid #1F1F1F;vertical-align:top}
.shotlist tr:hover td{background:#171717}
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.lvl i{width:8px;height:8px;border-radius:2px}
.tablewrap{overflow-x:auto}
.bar{margin-top:24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 20px;position:sticky;bottom:16px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.bar .grow{flex:1 1 200px;font-size:13px;color:var(--muted);text-align:right}
/* render */
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:14px}
.progress div{height:6px;background:var(--accent);box-shadow:0 0 12px rgba(200,255,61,.6);transition:width .6s}
.rail{list-style:none;margin:0 0 24px;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.rail li{padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.rail li .t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--muted)}
.rail li .t i{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;font-style:normal;border:1px solid var(--line3)}
.rail li.done .t{color:var(--text)}.rail li.done .t i{background:var(--line2);border-color:var(--line2)}
.rail li.now{background:var(--accent-bg);border-color:var(--accent)}.rail li.now .t{color:var(--text)}.rail li.now .t i{background:var(--accent);border-color:var(--accent);color:#0A0A0A}
.rail li .m{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.shot{border-radius:10px;overflow:hidden;background:var(--panel2);border-top:3px solid var(--mid)}
.shot .im{position:relative;background:#1A1A1A;aspect-ratio:16/9}
.shot.v .im{aspect-ratio:9/16}.shot.sq .im{aspect-ratio:1/1}
.shot img,.shot video{width:100%;height:100%;object-fit:cover;display:block}
.shot .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:12px;color:var(--dim);border:1px dashed var(--line3)}
.shot .tag{position:absolute;left:6px;top:6px;padding:2px 6px;border-radius:6px;background:rgba(10,10,10,.8);font-family:var(--mono);font-size:11px}
.shot .tag.r{left:auto;right:6px;color:var(--accent-text)}
.shot .ft{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 9px;font-size:12px}
.shot .ft .who{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shot .ft b{font-weight:600;white-space:nowrap}
.shot.still img{opacity:.75;filter:grayscale(.4)}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:14px}
.notes li{display:flex;gap:10px}.notes li i{font-style:normal;font-weight:800}
.banner{padding:14px 16px;border-radius:12px;background:#2A1A10;border:1px solid #6A4520;color:#FFD9A8;margin-bottom:18px}
/* result */
.player{background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.player video{width:100%;display:block;max-height:72vh;background:#000}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(64px,1fr);gap:3px;overflow-x:auto}
.strip button{padding:0;border-radius:6px;overflow:hidden;cursor:pointer;background:var(--panel2);border:2px solid transparent;min-height:44px}
.strip img{width:100%;height:56px;object-fit:cover;display:block}
.exports a{display:flex;justify-content:space-between;min-height:40px;align-items:center;text-decoration:none;font-weight:600;font-size:14px}
/* videos */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:var(--text);display:flex;flex-direction:column}
.vcard:hover{border-color:var(--line3);color:var(--text)}
.vcard .th{aspect-ratio:16/9;background:#1A1A1A}.vcard .th img{width:100%;height:100%;object-fit:cover;display:block}
.vcard .bd{padding:12px 14px}
.badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:2px 6px}
.badge.ok{background:var(--accent);color:#0A0A0A}.badge.run{background:#2B3A10;color:var(--accent-text)}.badge.pre{background:var(--line2);color:var(--text)}
/* overlay */
.overlay{position:fixed;inset:0;background:rgba(5,5,5,.86);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px}
.overlay .box{max-width:560px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 30px;text-align:center}
.spin{width:44px;height:44px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--accent);animation:sp 1s linear infinite;margin:0 auto 18px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;border:1px solid var(--line2);padding:12px 18px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw}
.hide{display:none!important}
@media (max-width:900px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rail{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  header.top{padding:12px 16px}main{padding:22px 16px 48px}h1{font-size:32px}
  nav.steps{margin-left:0}
}
@media (max-width:600px){nav.steps{display:none}.topright .toplink:last-child{display:none}}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="#/" aria-label="OneShot MV Studio, new video"><span class="dot" aria-hidden="true"></span><b>ONESHOT MV</b></a>
  <nav class="steps" aria-label="Steps" id="steps"></nav>
  <div class="topright">
    <span class="chip" id="sys"><span class="led" aria-hidden="true"></span>ComfyUI</span>
    <a class="toplink" href="#/videos">Your videos</a>
    <a class="toplink" href="/" target="_blank" rel="noopener">Open ComfyUI</a>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<div class="overlay hide" id="overlay" role="dialog" aria-modal="true" aria-labelledby="ovt"><div class="box"><div class="spin" aria-hidden="true"></div><h2 id="ovt" style="margin:0 0 8px;font-size:22px"></h2><p class="muted" id="ovs" style="margin:0"></p></div></div>
<div class="toast hide" id="toast" role="status"></div>

<script>
"use strict";
// ---------------------------------------------------------------- data
const WORLDS = [
  {id:"custom", title:"Custom", sub:"Describe your own world", text:""},
  {id:"rome", img:true, title:"Gladiator Games", sub:"Fighters first, then the crowd", sw:["#C9A15B","#8E3B22","#E8D3A9","#5C4630","#2B1C12"],
   text:"The gladiator games in ancient Rome, a blood-and-bronze spectacle on the sand of the packed Colosseum, played completely straight like an epic historical film, all invented adults: a champion murmillo gladiator in a bronze fish-crested helmet with the visor up, a short sword and a tall curved shield, a retiarius gladiator with a weighted net and a bronze trident, a thraex gladiator with his griffin-crested helmet under his arm, a gladiatrix in bronze greaves and a leather breastband with a short sword, the emperor in a purple toga and gold laurel wreath in the imperial box, a beautiful young noblewoman in fine dyed silk and gold earrings cheering in the stands, a rich senator in a white toga with a purple stripe betting gold in the front-row seats; the sand floor of the Colosseum in front of the roaring stands, the arena gate, the imperial box draped in purple; hard midday sun on the sand, the coloured shade of the awning over the stands"},
  {id:"night", img:true, title:"Night Shift", sub:"Cooks, nurses, guards and cabbies at 3 a.m.", sw:["#E08A2E","#8FBF6A","#1B2433","#C2373A","#0B0B0B"],
   text:"Night-shift workers you recognise at a glance, played straight and cinematic: a short-order cook in a paper hat and grease-spotted apron at a 24-hour diner, a nurse in scrubs with a stethoscope in a hospital corridor, a security guard in a navy uniform with a flashlight, a cab driver behind the wheel, a baker in flour-dusted whites at the ovens, a janitor with a mop cart, a gas station attendant, a firefighter in turnout gear at the station, a trucker at a truck stop; each in their own workplace at 3 a.m.; sodium-orange streetlight and buzzing fluorescent green"},
  {id:"florida", img:true, title:"Florida Retirement", sub:"Velour, visors and early-bird dinners", sw:["#F29BB2","#9ED9C3","#4FB3D9","#EAD7A8","#F6F3EA"],
   text:"A 1980s Florida retirement community, played completely straight and over the top: seniors in their seventies and eighties with big attitude, in velour tracksuits, sun visors, pearls, gold chains and oversized sunglasses, at aqua aerobics in the condo pool, the bingo hall, the shuffleboard court, the early-bird buffet and rows of golf carts; harsh Florida sun and sun-faded pastel colour"},
  {id:"y2k", img:true, title:"Y2K Pop Star", sub:"1999–2002, shot on a point-and-shoot", sw:["#F2A65A","#E86FA0","#3FA7C9","#C8B48A","#1E1A16"],
   text:"Pop stars of 1999 to 2002, the last years before smartphones and social media, all invented adults in their twenties, styled exactly the way pop artists dressed then: bubblegum-pop princesses, boy-band members, R&B divas, pop-punk singers and rappers; frosted tips, butterfly clips, crimped hair, tinted rimless shades and body glitter; low-rise flared jeans, baby tees, velour tracksuits, denim on denim and cargo pants; a bedroom with an inflatable chair and a lava lamp, an empty shopping-mall atrium with a fountain after closing time, a roller rink, a backyard pool with an inflatable raft, the back of a stretch limo; photographed with a 35mm point-and-shoot, direct flash, warm film colour and grain"},
];
const CUTS = ["every 2 bars","every bar","to the music (subtle)","to the music (intense)"];
const LEVEL_COL = {low:"var(--low)", medium:"var(--mid)", high:"var(--high)"};
const DEFAULT_BRIEF = {song:"", theme:"", world:"custom", seconds:30, start:-1, format:"16:9", preset:"quality", fx:"subtle",
  cuts_low:"every 2 bars", cuts_medium:"every bar", cuts_high:"to the music (subtle)", crowd:"auto", cast_order:"as written", seed:1, broll:0.125, qc:2};

// ---------------------------------------------------------------- state
const store = {
  get(k, d){ try{ const v = localStorage.getItem("osmv."+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("osmv."+k, JSON.stringify(v)); }catch(e){} },
};
const S = { brief: Object.assign({}, DEFAULT_BRIEF, store.get("brief", {})), songs: null, analysis: null, sys: null, timer: null };

// ---------------------------------------------------------------- helpers
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clock = t => { t = Math.max(0, +t || 0); return Math.floor(t/60) + ":" + String(Math.floor(t%60)).padStart(2,"0"); };
const mins = m => { m = Math.round(m); if (m < 60) return m + " min"; return Math.floor(m/60) + " h " + String(m%60).padStart(2,"0") + " min"; };
async function api(path, body){
  const r = await fetch("/oneshot-mv/api/" + path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {cache:"no-store"});
  let j = {}; try{ j = await r.json(); }catch(e){}
  if (!r.ok || j.error) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}
function toast(msg, ms=4200){ const t = $("#toast"); t.textContent = msg; t.classList.remove("hide"); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.add("hide"), ms); }
function overlay(title, sub){ const o = $("#overlay"); if (!title){ o.classList.add("hide"); return; } $("#ovt").textContent = title; $("#ovs").textContent = sub || ""; o.classList.remove("hide"); }
function estimate(b){ const sec = +b.seconds > 0 ? +b.seconds : (S.analysis ? S.analysis.duration : 30); return 6 + (b.preset === "quality" ? 2 : 1) * sec; }
function saveBrief(){ store.set("brief", S.brief); }
function stopTimer(){ if (S.timer){ clearInterval(S.timer); S.timer = null; } }
function setSteps(cur){
  const names = ["The Brief","The Plan","Rendering","Result"];
  $("#steps").innerHTML = names.map((n,i)=>{
    const st = i < cur ? "done" : (i === cur ? "now" : "");
    const mark = i < cur ? '<svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M2.5 6.5l2.5 2.5 4.5-5"/></svg>' : (i+1);
    return `<span class="step ${st}"${i===cur?' aria-current="step"':''}><span class="n">${mark}</span>${n}</span>`;
  }).join("");
}
function lvlBadge(l){ return `<span class="lvl"><i style="background:${LEVEL_COL[l]||'var(--mid)'}"></i>${esc(l||"")}</span>`; }

// ---------------------------------------------------------------- router
window.addEventListener("hashchange", route);
function route(){
  stopTimer();
  const h = location.hash.replace(/^#\/?/, "").split("/");
  const [page, run] = [h[0] || "", decodeURIComponent(h.slice(1).join("/") || "")];
  if (page === "plan" && run) return viewPlan(run);
  if (page === "render" && run) return viewRender(run);
  if (page === "result" && run) return viewResult(run);
  if (page === "videos") return viewVideos();
  return viewBrief();
}

  try{

    $("#sys").innerHTML = `<span class="led" aria-hidden="true"></span>ComfyUI${s.gpu ? " · " + esc(s.gpu) : ""}${q ? " · " + q + " in queue" : ""}`;
  }catch(e){
    $("#sys").innerHTML = `<span class="led off" aria-hidden="true"></span>ComfyUI not reachable`;

}

async function drawSong(){
  const b = S.brief;
  const pick = $("#songpick"), wave = $("#songwave");
  if (!b.song){
    wave.classList.add("hide"); $("#replace").classList.add("hide"); $("#playbtn").classList.add("hide");
    $("#songname").textContent = ""; $("#songmeta").textContent = "";
    pick.innerHTML = `<div class="drop" id="dropz" tabindex="0" role="button" aria-label="Upload a song">
        <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <div style="font-weight:700;font-size:16px">Drop a song here, or click to upload</div>
        <div class="muted" style="font-size:13px">WAV, MP3, FLAC or M4A. It goes into ComfyUI's input folder.</div>
        <input type="file" id="file" accept="audio/*,.wav,.mp3,.flac,.m4a,.ogg" class="hide">
      </div>
      <label class="field" style="margin-top:14px">Or pick one already in ComfyUI's input folder<select id="songsel"><option value="">Loading…</option></select></label>`;
    const dz = $("#dropz"), fi = $("#file");
    dz.onclick = () => fi.click();
    dz.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); fi.click(); } };
    dz.ondragover = e => { e.preventDefault(); dz.classList.add("over"); };
    dz.ondragleave = () => dz.classList.remove("over");
    dz.ondrop = e => { e.preventDefault(); dz.classList.remove("over"); if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); };
    fi.onchange = () => { if (fi.files[0]) upload(fi.files[0]); };
    try{
      S.songs = await api("songs");
      const sel = $("#songsel");
      if (!sel) return;
      sel.innerHTML = `<option value="">Choose a song…</option>` + S.songs.map(s => `<option value="${esc(s.name)}">${esc(s.name)}</option>`).join("");
      sel.onchange = () => { if (sel.value){ b.song = sel.value; b.start = -1; saveBrief(); drawSong(); } };
    }catch(e){ const sel = $("#songsel"); if (sel) sel.innerHTML = `<option>Couldn't list the input folder</option>`; }
    return;
  }
  pick.innerHTML = "";
  $("#songname").textContent = b.song.split("/").pop();
  $("#songmeta").textContent = "analysing…";
  $("#replace").classList.remove("hide");
  try{
    const a = S.analysis = await api(`analyze?song=${encodeURIComponent(b.song)}&seconds=${b.seconds}&start=${b.start}`);
    $("#songmeta").textContent = `${clock(a.duration)} · ${Math.round(a.tempo)} BPM${a.drop != null ? " · drop at " + clock(a.drop) : ""}`;
    drawWave();
  }catch(e){
    $("#songmeta").textContent = "";
    pick.innerHTML = `<p class="banner" style="margin:14px 0 0">Couldn't read this song: ${esc(e.message)}</p>`;
  }
}

function drawWave(){
  const a = S.analysis, b = S.brief;
  $("#songwave").classList.remove("hide");
  const n = a.env.length, d = a.duration;
  const levelAt = t => { const s = a.sections.find(x => t >= x.start && t < x.end); return s ? s.level : "medium"; };
  const [w0, w1] = a.window;
  $("#bars").innerHTML = a.env.map((v,i) => { const t = (i + 0.5) / n * d; const inWin = t >= w0 && t <= w1;
    return `<span style="height:${Math.max(6, Math.round(10 + v * 100))}px;background:${LEVEL_COL[levelAt(t)]};opacity:${inWin ? 1 : .38}"></span>`; }).join("");
  const L = w0 / d * 100, W = (w1 - w0) / d * 100;
  Object.assign($("#win").style, {left: L + "%", width: W + "%"});
  $("#win").setAttribute("aria-label", `The part of the song in the video: ${clock(w0)} to ${clock(w1)}`);
  Object.assign($("#wl").style, {left: L + "%"}); $("#wl").textContent = `${clock(w0)} – ${clock(w1)}`;
  const tk = []; const step = d > 240 ? 60 : 30;
  for (let t = 0; t < d - step * .4; t += step) tk.push(`<span style="left:${t/d*100}%">${clock(t)}</span>`);
  tk.push(`<span style="right:0">${clock(d)}</span>`);
  $("#ticks").innerHTML = tk.join("");
  const lens = [[15,"15 s"],[30,"30 s"],[60,"60 s"],[0,"Whole song"]];
  $("#lens").innerHTML = lens.map(l => `<button type="button" class="opt" data-l="${l[0]}" aria-pressed="${+b.seconds===l[0]}">${l[1]}</button>`).join("")
    + `<button type="button" class="opt" id="auto" aria-pressed="${+b.start<0}" title="Let OneShot MV pick the strongest part">Auto</button>`;
  $("#lens").querySelectorAll("[data-l]").forEach(el => el.onclick = () => { b.seconds = +el.dataset.l; saveBrief(); drawSong(); viewBriefTiersRefresh(); });
  $("#auto").onclick = () => { b.start = -1; saveBrief(); drawSong(); };
  $("#winnote").textContent = +b.start < 0 ? (+b.seconds > 0 ? "Picked for you: the strongest stretch, with the drop or chorus early on. Click the waveform to start somewhere else." : "The whole song.")
    : `Starts at ${clock(b.start)} (moved back to the nearest bar line). Auto lets OneShot MV pick.`;
  $("#wave").onclick = e => { if (+b.seconds <= 0) return; const r = e.currentTarget.getBoundingClientRect(); b.start = Math.max(0, Math.round(((e.clientX - r.left) / r.width) * d * 100) / 100); saveBrief(); drawSong(); };
  // play the chosen part
  const au = $("#audio"), pb = $("#playbtn"), ph = $("#ph");
  pb.classList.remove("hide");
  if (au.dataset.src !== a.url){ au.src = a.url; au.dataset.src = a.url; }
  pb.textContent = au.paused ? "Play this part" : "Stop";
  pb.onclick = () => { if (!au.paused){ au.pause(); return; } au.currentTime = w0; au.play().catch(()=>toast("The browser couldn't play this file.")); };
  au.onplay = () => { pb.textContent = "Stop"; ph.style.display = "block"; };
  au.onpause = () => { pb.textContent = "Play this part"; ph.style.display = "none"; };
  au.ontimeupdate = () => { ph.style.left = (au.currentTime / d * 100) + "%"; if (au.currentTime >= w1) au.pause(); };
}
function viewBriefTiersRefresh(){ const b = S.brief; const tiers = $("#tiers"); if (!tiers) return;
  tiers.querySelectorAll(".tier").forEach(el => { const e = estimate(Object.assign({}, b, {preset: el.dataset.q})); el.querySelector(".eta").textContent = "≈ " + mins(e); });
  const sec = +b.seconds > 0 ? b.seconds + " s" : "the whole song"; const n = $("#etanote"); if (n) n.textContent = `Times are a rough guide for ${sec}${S.sys && S.sys.gpu ? " on " + S.sys.gpu : ""}.`; }

async function upload(file){
  overlay("Uploading the song", file.name);
  try{
    const fd = new FormData(); fd.append("image", file, file.name); fd.append("type", "input"); fd.append("overwrite", "false");
    const r = await fetch("/api/upload/image", {method:"POST", body:fd});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    S.brief.song = (j.subfolder ? j.subfolder + "/" : "") + j.name; S.brief.start = -1; saveBrief();
    overlay(); drawSong();
  }catch(e){ overlay(); toast("Upload failed: " + e.message); }
}

async function start(render, briefOverride){
  const b = Object.assign({}, briefOverride || S.brief);
  if (!b.song){ toast("Pick a song first."); return; }
  b.render = !!render;
  try{
    overlay(render ? "Starting the video" : "Writing the plan", render ? "Analysing the song, writing the World and queueing every shot. This takes a minute or two." : "Analysing the song, writing the World and planning every shot. Nothing renders yet.");
    const {prompt_id} = await api("start", b);
    const brief = Object.assign({}, b); delete brief.render;
    const t0 = Date.now();
    for (;;){
      await new Promise(r => setTimeout(r, 2000));
      const j = await api("job/" + prompt_id);
      const el = Math.round((Date.now() - t0) / 1000);
      if (j.state === "queued") $("#ovs").textContent = `Waiting in ComfyUI's queue (${j.ahead} ahead) · ${el} s`;
      else if (j.state === "running") $("#ovs").textContent = (render ? "Analysing the song, writing the World and queueing every shot" : "Analysing the song, writing the World and planning every shot") + ` · ${el} s`;
      else if (j.state === "error") throw new Error(j.error);
      else if (j.state === "done"){
        if (!j.run) throw new Error("the Director finished without a run folder");
        const briefs = store.get("briefs", {}); briefs[j.run] = brief; store.set("briefs", briefs);
        overlay(); location.hash = (render ? "#/render/" : "#/plan/") + encodeURIComponent(j.run); return;
      }
    }
  }catch(e){ overlay(); toast("It didn't start: " + e.message, 9000); }
}

// ---------------------------------------------------------------- 2. The Plan

  setSteps(1);

  app.innerHTML = `<p class="muted">Loading the plan…</p>`;

  const w = r.world, b = r.brief;
  const brief = store.get("briefs", {})[run];
  const sing = r.shots.filter(s => s.kind === "sing").length, cut = r.shots.length - sing;
  const est = brief ? estimate(Object.assign({}, brief)) : r.estimate_min;
  const levels = r.shots.map(s => `<span style="flex:${s.len};background:${LEVEL_COL[s.energy]||'var(--mid)'}" title="${esc(s.time)} ${esc(s.energy)}"></span>`).join("");
  app.innerHTML = `
  <div class="head"><div><h1>The plan</h1><p class="sub">${esc(w.headline || "House look")} · ${esc(b.from)} – ${esc(b.to)} · ${esc(b.format)} · ${esc(b.preset)} · ${r.shots.length} shots</p></div>
    <span class="mono muted" style="font-size:12px">Nothing is rendered yet</span></div>
  <div class="cols">
   <section class="card stack" style="flex:1 1 340px;min-width:0;gap:18px" aria-labelledby="wh">
     <div class="row" style="justify-content:space-between"><h2 class="label" id="wh">The World</h2><a href="#/" style="font-size:13px;font-weight:600;text-decoration:none">Edit</a></div>
     <p style="margin:0;font-size:18px;line-height:1.35;font-weight:600">${esc(w.headline || "The house look: no World line")}</p>
     ${w.camera ? `<div><div class="kv">Camera</div><div style="font-size:14px;color:#D4D4D4">${esc(w.camera)}</div></div>` : ""}
     ${w.places && w.places.length ? `<div><div class="kv">Places</div><div style="font-size:14px;color:#D4D4D4">${esc(w.places.slice(0,6).map(p=>String(p).replace(/^(in|on|at|near|by) (the )?/i,"")).join(" · "))}${w.places.length > 6 ? " · …" : ""}</div></div>` : ""}
     ${w.light && w.light.length ? `<div><div class="kv">Light</div><div style="font-size:14px;color:#D4D4D4">${esc(w.light.slice(0,4).join(" · "))}</div></div>` : ""}
     <div><div class="kv">Cast</div><div style="font-size:14px;color:#D4D4D4">${w.characters} characters in the World${w.left_out.length ? `; not in this cut: ${esc(w.left_out.slice(0,10).join(", "))}${w.left_out.length > 10 ? "…" : ""}` : ""}.</div></div>
     <div><div class="kv">Energy</div><div class="emap" aria-hidden="true">${levels}</div>
       <ul class="tiny" style="margin:8px 0 0;padding-left:16px">${(r.energy_map||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
     <p class="tiny" style="margin:0">To change who is in it, edit the World line: the characters it names are cast first, in that order. Same seed, same cast; a new seed re-casts.</p>
   </section>
   <section class="card" style="flex:999 1 720px;min-width:0" aria-labelledby="sh">
     <div class="row" style="margin-bottom:10px"><h2 class="label" id="sh">Every shot</h2><span class="tiny">${sing} sung, ${cut} cutaway${cut===1?"":"s"}</span></div>
     <div class="tablewrap"><table class="shotlist"><thead><tr><th>#</th><th>Time</th><th>Energy</th><th>Shot</th><th>Who</th><th>Wearing</th><th>Where</th></tr></thead>
     <tbody>${r.shots.map(s => `<tr><td class="mono muted">${s.n}</td><td class="mono">${esc(s.time)}<div class="tiny">${s.len}s</div></td><td>${lvlBadge(s.energy)}</td><td class="muted">${s.kind==="broll"?"cutaway":esc(s.size)}</td>
       <td><b>${esc(s.role || "?")}</b><div class="tiny">${esc([s.gender, s.age].filter(Boolean).join(", "))}</div></td><td class="muted" style="max-width:280px">${esc(s.wear)}</td><td class="muted" style="max-width:240px">${esc(s.place)}</td></tr>`).join("")}</tbody></table></div>
   </section>
  </div>
  <div class="bar">
    <a class="btn" href="#/">Change the World</a>
    <button class="btn" id="shuffle" type="button" ${brief ? "" : "disabled"}>Shuffle the cast</button>
    <span class="grow">${r.shots.length} shots · ${sing} singers · about ${mins(est)} on this GPU</span>
    <button class="btn primary big" id="make" type="button" ${brief ? "" : "disabled"}>Make the video <span class="mono" style="font-size:12px;font-weight:600;opacity:.75">≈ ${mins(est)}</span></button>
  </div>
  ${brief ? "" : `<p class="note">This plan was made outside the Studio, so start the render from <a href="#/">The Brief</a>.</p>`}`;
  if (brief){
    $("#make").onclick = () => start(true, brief);
    $("#shuffle").onclick = () => { const nb = Object.assign({}, brief, {seed: (+brief.seed || 1) + 1}); S.brief = Object.assign({}, S.brief, {seed: nb.seed}); saveBrief(); start(false, nb); };
  }
}

// ---------------------------------------------------------------- 3. Rendering
async function viewRender(run){
  setSteps(2);
  const app = $("#app");
  app.innerHTML = `<p class="muted">Loading…</p>`;
  let first = true;
  const tick = async () => {
    let r;
    try{ r = await api("run/" + encodeURIComponent(run)); }catch(e){ if (first) app.innerHTML = `<p class="banner">${esc(e.message)}</p>`; return; }
    if (r.stage === "done"){ stopTimer(); location.hash = "#/result/" + encodeURIComponent(run); return; }
    if (r.stage === "preview"){ stopTimer(); location.hash = "#/plan/" + encodeURIComponent(run); return; }
    if (first){ renderSkeleton(r); first = false; }
    renderUpdate(r);
  };
  await tick();
  S.timer = setInterval(tick, 5000);
}
function shotClass(fmt){ return fmt === "9:16" ? "v" : (fmt === "1:1" ? "sq" : ""); }
function renderSkeleton(r){
  const app = $("#app");
  app.innerHTML = `
  <div class="head"><div><h1>Making your video</h1><p class="sub">${esc(r.world.headline || "House look")} · ${esc(r.brief.from)} – ${esc(r.brief.to)} · ${esc(r.brief.format)} · ${esc(r.brief.preset)}</p></div>
    <div style="text-align:right"><div class="mono" style="font-size:22px;font-weight:600" id="elapsed"></div><div class="muted" style="font-size:14px" id="left"></div></div></div>
  <div id="stall"></div>
  <div class="progress" role="progressbar" aria-label="Overall progress" aria-valuemin="0" aria-valuemax="100" id="pbar"><div id="pfill" style="width:0"></div></div>
  <ol class="rail" aria-label="Stages" id="rail"></ol>
  <div class="cols">
    <section class="card" style="flex:999 1 760px;min-width:0;padding:20px 22px" aria-labelledby="sbh">
      <div class="row" style="margin-bottom:14px"><h2 class="label" id="sbh">Storyboard</h2>
        <div class="legend"><span><i style="background:var(--low)"></i>Low</span><span><i style="background:var(--mid)"></i>Medium</span><span><i style="background:var(--high)"></i>High</span></div></div>
      <div class="board" id="board"></div>
    </section>
    <aside class="colside">
      <section class="card" aria-labelledby="lth"><h2 class="label" id="lth" style="margin-bottom:12px">Latest take</h2><div id="latest" class="muted" style="font-size:14px">No clips yet. Stills come first.</div></section>
      <section class="card" aria-labelledby="qch"><h2 class="label" id="qch" style="margin-bottom:12px">Checks</h2><ul class="notes" id="notes"></ul></section>
      <p class="muted" style="margin:0;font-size:13px;padding:0 4px">You can close this tab. The render keeps going in ComfyUI, and this page picks up where it is when you come back.</p>
      <div class="row"><a class="btn" href="/" target="_blank" rel="noopener" style="flex:1">Open ComfyUI</a><button class="btn danger" id="cancel" type="button" style="flex:1">Stop this video</button></div>
    </aside>
  </div>`;
  $("#cancel").onclick = async () => {
    if (!confirm("Stop this video? Its queued shots are removed and the one rendering stops.")) return;
    try{ const j = await api("cancel", {run: r.run}); toast(`Stopped: ${j.removed} queued job${j.removed===1?"":"s"} removed.`); }catch(e){ toast(e.message); }
  };
}
function renderUpdate(r){
  $("#elapsed").textContent = `${mins(r.elapsed_min)} in`;
  $("#left").textContent = r.stalled ? "stopped" : (r.left_min > 0 ? `about ${mins(r.left_min)} to go` : "nearly there");
  $("#pfill").style.width = r.pct + "%"; $("#pbar").setAttribute("aria-valuenow", r.pct);
  $("#stall").innerHTML = r.stalled ? `<div class="banner">Nothing of this video is left in ComfyUI's queue, but it isn't finished. A step probably failed: the ComfyUI console shows why. You can start it again from <a href="#/">The Brief</a>.</div>` : "";
  $("#rail").innerHTML = r.stages.map((s,i) => `<li class="${s.state}"><div class="t"><i aria-hidden="true">${s.state==="done" ? "✓" : i+1}</i>${esc(s.name)}</div><div class="m">${esc(s.meta)}</div></li>`).join("");
  const cls = shotClass(r.brief.format);
  $("#board").innerHTML = r.shots.map(s => {
    const img = s.still ? `<img src="${esc(s.still)}" alt="${esc(s.role)}" loading="lazy">` : `<div class="ph">${s.kind==="broll" ? "Cutaway, chosen after the take check" : "Waiting for its still"}</div>`;
    const st = s.state === "clip" ? (s.kind==="broll" ? "✓ cutaway" : (s.takes > 1 ? `✓ take ${s.takes}` : "✓ sung")) : (s.state === "still" ? (s.kind==="broll" ? "still ready" : "still ready") : "planned");
    const col = s.state === "clip" ? "var(--accent)" : (s.state === "still" ? "var(--text)" : "var(--muted)");
    return `<div class="shot ${cls} ${s.state==="still" ? "still" : ""}" style="border-top-color:${LEVEL_COL[s.energy]||'var(--mid)'}"><div class="im">${img}<span class="tag">${esc(s.time)}</span>${s.kind==="broll" ? '<span class="tag r">cutaway</span>' : ""}</div>
      <div class="ft"><span class="who" title="${esc(s.role)}">${esc(s.role || s.size)}</span><b style="color:${col}">${st}</b></div></div>`;
  }).join("");
  if (r.latest){
    const cur = $("#latest video");
    if (!cur || cur.dataset.src !== r.latest) $("#latest").innerHTML = `<video src="${esc(r.latest)}" data-src="${esc(r.latest)}" autoplay muted loop playsinline style="width:100%;border-radius:10px;display:block"></video>`;
  }
  const icon = {fix:['↻','var(--warn)'], redo:['↻','var(--warn)'], ok:['✓','var(--accent)']};
  $("#notes").innerHTML = r.notes.length ? r.notes.map(n => `<li><i aria-hidden="true" style="color:${(icon[n.kind]||['·','var(--muted)'])[1]}">${(icon[n.kind]||['·'])[0]}</i><span>${esc(n.text)}</span></li>`).join("")
    : `<li><i aria-hidden="true" class="muted">·</i><span class="muted">The vision check looks at every still before any clip is made; the take check scores every clip's lip sync.</span></li>`;
}

// ---------------------------------------------------------------- 4. Result
async function viewResult(run){
  setSteps(3);
  const app = $("#app");
  let r;
  try{ r = await api("run/" + encodeURIComponent(run)); }catch(e){ app.innerHTML = `<p class="banner">${esc(e.message)}</p>`; return; }
  if (r.stage !== "done"){ location.hash = (r.stage === "preview" ? "#/plan/" : "#/render/") + encodeURIComponent(run); return; }
  const sing = r.shots.filter(s => s.kind === "sing").length;
  app.innerHTML = `
  <div class="head"><div><h1>${esc(r.world.headline || "Your video")}</h1><p class="sub">${esc(r.brief.from)} – ${esc(r.brief.to)} · ${esc(r.brief.format)} · ${esc(r.brief.preset)} · ${sing} singers · FX ${esc(r.brief.fx)} · made in ${mins(r.elapsed_min)}</p></div>
    <div class="row"><a class="btn" href="#/">New video</a><a class="btn primary" id="dl" href="${esc(r.video)}" download="${esc(r.run)}.mp4"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2v9M4 7l4 4 4-4M3 14h10"/></svg>Download MP4</a></div></div>
  <div class="cols">
    <div class="colmain" style="gap:16px">
      <div class="player"><video id="vid" src="${esc(r.video)}" controls playsinline preload="metadata"></video></div>
      <section class="card" style="padding:16px 18px 18px" aria-labelledby="tlh"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h2 class="label" id="tlh">Shots</h2><span class="tiny">Click a shot to jump to it</span></div>
        <div class="strip" id="strip">${r.shots.map(s => `<button type="button" data-t="${s.t0}" aria-label="Shot ${s.n}, ${esc(s.time)}, ${esc(s.role)}" style="border-top:3px solid ${LEVEL_COL[s.energy]||'var(--mid)'}">${s.still ? `<img src="${esc(s.still)}" alt="" loading="lazy">` : `<span style="display:block;height:56px"></span>`}</button>`).join("")}</div></section>
    </div>
    <aside class="colside">
      <section class="card" aria-labelledby="rch">
        <div class="row" style="justify-content:space-between"><h2 style="margin:0;font-size:18px;font-weight:800" id="rch">Re-edit</h2><span style="font-size:12px;color:var(--accent);font-weight:600">free · nothing re-renders</span></div>
        <div class="field" style="margin-top:14px">Audio FX on the drums<div class="seg" role="group" aria-label="Audio FX" id="rfx"></div></div>
        <button class="btn" id="recut" type="button" style="width:100%;margin-top:14px;border-color:var(--accent)">Re-edit · about a minute</button>
        <p class="tiny" style="margin:10px 0 0">The new cut replaces this one. The cut per energy level is set in The Brief.</p>
      </section>
      <section class="card exports" aria-labelledby="exh"><h2 class="label" id="exh" style="margin-bottom:10px">Also export</h2>
        ${r.edl ? `<a href="${esc(r.edl)}" download="${esc(r.run)}.edl">Edit list for Resolve or Premiere<span class="mono dim" style="font-size:12px">.edl</span></a>` : ""}
        <a href="#/plan-info/${encodeURIComponent(r.run)}" id="showplan">The plan, shot by shot<span class="mono dim" style="font-size:12px">view</span></a>
      </section>
      <section class="card" aria-labelledby="wh2"><h2 class="label" id="wh2" style="margin-bottom:10px">The World</h2><p style="margin:0;font-size:14px;color:#D4D4D4">${esc(r.world.line ? r.world.line.slice(0, 420) + (r.world.line.length > 420 ? "…" : "") : "The house look.")}</p></section>
    </aside>
  </div>`;
  const vid = $("#vid");
  $("#strip").querySelectorAll("button").forEach(el => el.onclick = () => { vid.currentTime = +el.dataset.t; vid.play().catch(()=>{}); });
  let fx = r.brief.fx || "subtle";
  const drawRfx = () => { $("#rfx").innerHTML = ["none","subtle","intense"].map(f => `<button type="button" class="opt" data-x="${f}" aria-pressed="${fx===f}">${f}</button>`).join("");
    $("#rfx").querySelectorAll(".opt").forEach(el => el.onclick = () => { fx = el.dataset.x; drawRfx(); }); };
  drawRfx();
  $("#showplan").onclick = e => { e.preventDefault(); showPlanTable(r); };
  $("#recut").onclick = async () => {
    try{
      overlay("Re-editing", "A new cut with " + fx + " FX. Nothing re-renders.");
      const {prompt_id} = await api("recut", {run: r.run, fx});
      for (;;){ await new Promise(res => setTimeout(res, 2000)); const j = await api("job/" + prompt_id); if (j.state === "error") throw new Error(j.error); if (j.state === "done") break; }
      overlay(); viewResult(r.run); toast("New cut ready.");
    }catch(e){ overlay(); toast("Re-edit failed: " + e.message, 8000); }
  };
}
function showPlanTable(r){
  const box = document.createElement("section"); box.className = "card"; box.style.marginTop = "24px";
  box.innerHTML = `<h2 class="label" style="margin-bottom:10px">The plan</h2><div class="tablewrap"><table class="shotlist"><thead><tr><th>#</th><th>Time</th><th>Energy</th><th>Who</th><th>Wearing</th><th>Where</th></tr></thead><tbody>${r.shots.map(s => `<tr><td class="mono muted">${s.n}</td><td class="mono">${esc(s.time)}</td><td>${lvlBadge(s.energy)}</td><td><b>${esc(s.role)}</b></td><td class="muted">${esc(s.wear)}</td><td class="muted">${esc(s.place)}</td></tr>`).join("")}</tbody></table></div>`;
  $("#app").appendChild(box); box.scrollIntoView({behavior:"smooth"});
}

// ---------------------------------------------------------------- Your videos
async function viewVideos(){
  setSteps(-1);
  const app = $("#app");
  app.innerHTML = `<div class="head"><div><h1>Your videos</h1><p class="sub">Every OneShot MV run on this ComfyUI, newest first.</p></div><a class="btn primary" href="#/">New video</a></div><div class="vgrid" id="vg"><p class="muted">Loading…</p></div>`;
  try{
    const runs = await api("runs");
    $("#vg").innerHTML = runs.length ? runs.map(v => {
      const st = v.video ? ["ok","Done","result"] : (v.rendered ? ["run","Rendering","render"] : ["pre","Plan","plan"]);
      return `<a class="vcard" href="#/${st[2]}/${encodeURIComponent(v.run)}"><div class="th">${v.thumb ? `<img src="${esc(v.thumb)}" alt="" loading="lazy">` : ""}</div>
        <div class="bd"><div class="row" style="justify-content:space-between;gap:8px"><b style="font-size:15px">${esc(v.world || "House look")}</b><span class="badge ${st[0]}">${st[1]}</span></div>
        <div class="tiny mono" style="margin-top:4px">${esc(v.when.replace("T"," "))} · ${esc(v.format||"")} · ${v.seconds}s</div><div class="tiny" style="margin-top:2px;word-break:break-all">${esc(v.run)}</div></div></a>`;
    }).join("") : `<p class="muted">No runs yet. <a href="#/">Make your first video.</a></p>`;
  }catch(e){ $("#vg").innerHTML = `<p class="banner">${esc(e.message)}</p>`; }
}

loadSystem();
setInterval(loadSystem, 30000);
route();
</script>
</body>
</html>
